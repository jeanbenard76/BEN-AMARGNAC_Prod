services:
  benarmagnac:
    build: .
    container_name: benarmagnac_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-change_this_to_a_secure_random_key_in_production}
      - DATABASE_PATH=/app/data/cave.db
      - PORT=5000
    volumes:
      # Persistent SQLite data directory
      - ./data:/app/data

